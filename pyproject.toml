[tool.uv.workspace]
members = ["core"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["core/tests"]
addopts = "--cov=core --cov-report=term-missing"
